<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar e Corrigir - FLEXCREDI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 20px;
        }
        .alert {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .btn {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            font-weight: 700;
            margin: 10px 0;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.4);
        }
        .btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        .log {
            background: #2c3e50;
            color: #2ecc71;
            padding: 25px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.8;
            margin-top: 20px;
            display: none;
        }
        .success { color: #2ecc71; font-weight: bold; }
        .error { color: #e74c3c; font-weight: bold; }
        .info { color: #3498db; }
        .warning { color: #f39c12; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 VERIFICAR ARQUIVO NO GITHUB</h1>
        
        <div class="alert">
            <h3>❌ PROBLEMA:</h3>
            <p>O site que está no ar NÃO é o correto!</p>
            <p>Vamos verificar qual arquivo está realmente no GitHub.</p>
        </div>
        
        <button class="btn" onclick="checkFile()">
            1️⃣ VERIFICAR O QUE ESTÁ NO GITHUB
        </button>
        
        <button class="btn" onclick="uploadCorrect()" style="display:none;" id="uploadBtn">
            2️⃣ SUBSTITUIR PELO ARQUIVO CORRETO
        </button>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        const TOKEN = "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";
        const USER = "chazmarques-blip";
        const REPO = "FLEXCREDI-COMPLETO";
        const headers = {
            "Authorization": `token ${TOKEN}`,
            "Accept": "application/vnd.github.v3+json"
        };

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            logEl.style.display = 'block';
            const entry = document.createElement('div');
            entry.className = type;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function checkFile() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ VERIFICANDO...';
            
            log('🔍 VERIFICANDO index.html NO GITHUB...', 'info');
            log('', 'info');
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${USER}/${REPO}/contents/index.html`,
                    { headers }
                );
                
                if (response.ok) {
                    const data = await response.json();
                    const content = atob(data.content);
                    
                    log('✅ Arquivo encontrado', 'success');
                    log(`📊 Tamanho: ${(data.size / 1024).toFixed(1)} KB`, 'info');
                    log(`📦 SHA: ${data.sha.substring(0, 7)}`, 'info');
                    log('', 'info');
                    
                    // Verificações
                    const hasCarousel = content.includes('carousel-slide');
                    const hasEnglish = content.includes('lang="en"');
                    const hasCSS = content.includes('css/style.css');
                    const hasMosaicImages = content.includes('mosaic-restaurant.jpg');
                    
                    log('🔍 ANÁLISE DO ARQUIVO:', 'warning');
                    log(`   Tamanho esperado: ~94 KB`, content.length > 90000 ? 'success' : 'error');
                    log(`   Tamanho atual: ${(content.length / 1024).toFixed(1)} KB`, 'info');
                    log(`   HTML lang="en": ${hasEnglish ? '✅' : '❌'}`, hasEnglish ? 'success' : 'error');
                    log(`   Carousel slides: ${hasCarousel ? '✅' : '❌'}`, hasCarousel ? 'success' : 'error');
                    log(`   CSS linkado: ${hasCSS ? '✅' : '❌'}`, hasCSS ? 'success' : 'error');
                    log(`   Imagens mosaic: ${hasMosaicImages ? '✅' : '❌'}`, hasMosaicImages ? 'success' : 'error');
                    log('', 'info');
                    
                    if (!hasCarousel || !hasEnglish || content.length < 90000) {
                        log('❌ ARQUIVO ERRADO CONFIRMADO!', 'error');
                        log('', 'info');
                        log('💡 SOLUÇÃO:', 'warning');
                        log('   Precisamos substituir este arquivo pelo correto', 'info');
                        log('   O arquivo correto tem 94 KB e está no GenSpark', 'info');
                        log('', 'info');
                        log('⚠️ IMPORTANTE:', 'warning');
                        log('   Baixe NOVAMENTE o arquivo index-para-upload.html', 'info');
                        log('   Ele está no GenSpark', 'info');
                        
                        document.getElementById('uploadBtn').style.display = 'block';
                    } else {
                        log('✅ ARQUIVO PARECE CORRETO!', 'success');
                        log('', 'info');
                        log('🤔 MAS O SITE ESTÁ ERRADO?', 'warning');
                        log('   Possíveis causas:', 'info');
                        log('   1. Cache do browser (Ctrl+Shift+R)', 'info');
                        log('   2. GitHub Pages não atualizou ainda', 'info');
                        log('   3. Arquivos CSS faltando', 'info');
                    }
                    
                } else {
                    log(`❌ Erro ${response.status}`, 'error');
                }
                
                btn.disabled = false;
                btn.textContent = '🔄 VERIFICAR NOVAMENTE';
                
            } catch (error) {
                log(`❌ Erro: ${error.message}`, 'error');
                btn.disabled = false;
                btn.textContent = '🔄 TENTAR NOVAMENTE';
            }
        }

        function uploadCorrect() {
            log('', 'info');
            log('📋 INSTRUÇÕES PARA UPLOAD CORRETO:', 'warning');
            log('', 'info');
            log('1. Volte para o GenSpark', 'info');
            log('2. Baixe o arquivo: index-para-upload.html', 'info');
            log('3. Abra o arquivo: upload-garantido-final.html', 'info');
            log('4. Selecione index-para-upload.html', 'info');
            log('5. Faça o upload', 'info');
            log('6. Aguarde a confirmação', 'info');
            log('7. Aguarde 5 minutos para GitHub Pages atualizar', 'info');
            log('', 'info');
            log('💡 ATENÇÃO:', 'warning');
            log('   O upload DEVE demorar 15-30 segundos', 'info');
            log('   Se for rápido (1-2 seg), NÃO funcionou', 'info');
        }
    </script>
</body>
</html>
