<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Aplicação - FlexCredi Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/admin-panel/css/admin.css">
    <style>
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
            padding: 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .app-title h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: #1a1a1a;
        }
        .app-title p {
            margin: 0;
            color: #666;
        }
        .app-amount {
            text-align: right;
        }
        .amount-requested {
            font-size: 32px;
            font-weight: 700;
            color: #2ECC71;
        }
        .amount-label {
            font-size: 14px;
            color: #666;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-top: 8px;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .status-analyzing { background: #cce5ff; color: #004085; }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }
        .detail-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .detail-card h3 {
            margin: 0 0 20px 0;
            font-size: 16px;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-card h3 i {
            color: #2ECC71;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            color: #666;
            font-size: 14px;
        }
        .detail-value {
            font-weight: 500;
            color: #1a1a1a;
        }
        .action-panel {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }
        .action-panel h3 {
            margin: 0 0 20px 0;
            color: #1a1a1a;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-approve {
            background: #2ECC71;
            color: white;
        }
        .btn-approve:hover {
            background: #27ae60;
        }
        .btn-reject {
            background: #e74c3c;
            color: white;
        }
        .btn-reject:hover {
            background: #c0392b;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .approval-form {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .approval-form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #666;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-link:hover {
            color: #2ECC71;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        .documents-list {
            margin-top: 16px;
        }
        .document-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .document-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .document-icon {
            width: 40px;
            height: 40px;
            background: #2ECC71;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .document-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .doc-pending { background: #fff3cd; color: #856404; }
        .doc-approved { background: #d4edda; color: #155724; }
        .doc-rejected { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <img src="/assets/img/logo-flexcredi.png" alt="FlexCredi" class="sidebar-logo">
            </div>
            <nav class="sidebar-nav">
                <a href="/admin-panel/admin/admin-dashboard.html" class="nav-item">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="/admin-panel/admin/admin-aplicacoes.html" class="nav-item active">
                    <i class="fas fa-file-alt"></i> Applications
                </a>
                <a href="/admin-panel/admin/admin-clientes.html" class="nav-item">
                    <i class="fas fa-users"></i> Clients
                </a>
                <a href="/admin-panel/admin/admin-partners.html" class="nav-item">
                    <i class="fas fa-handshake"></i> Partners
                </a>
                <a href="/admin-panel/admin/admin-documents.html" class="nav-item">
                    <i class="fas fa-folder"></i> Documents
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <button class="mobile-menu-toggle" id="mobileMenuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="header-user">
                    <div class="user-avatar">AD</div>
                    <span>Admin</span>
                </div>
            </header>

            <div class="admin-content">
                <a href="/admin-panel/admin/admin-aplicacoes.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Voltar para Aplicações
                </a>

                <div id="appContent">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p>Carregando dados da aplicação...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
    const API_URL = 'https://flexcredi-site-adm-production-b27d.up.railway.app';
    
    const urlParams = new URLSearchParams(window.location.search);
    const appId = urlParams.get('id');

    async function loadApplication() {
        if (!appId) {
            showError('ID da aplicação não fornecido');
            return;
        }

        try {
            const response = await fetch(`${API_URL}/api/admin/applications/${appId}`);
            const data = await response.json();

            if (!data.success) {
                throw new Error(data.error || 'Erro ao carregar aplicação');
            }

            renderApplication(data.application);
        } catch (error) {
            console.error('Error:', error);
            showError(error.message);
        }
    }

    function showError(message) {
        document.getElementById('appContent').innerHTML = `
            <div class="loading">
                <i class="fas fa-exclamation-triangle fa-3x" style="color: #e74c3c;"></i>
                <p>${message}</p>
                <a href="/admin-panel/admin/admin-aplicacoes.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
            </div>
        `;
    }

    function renderApplication(app) {
        const statusClass = (app.status || 'pending').toLowerCase();
        
        document.getElementById('appContent').innerHTML = `
            <!-- Header -->
            <div class="app-header">
                <div class="app-title">
                    <h1>Aplicação #${app.id.substring(0, 8)}</h1>
                    <p><i class="fas fa-user"></i> ${app.clientName || 'N/A'} - ${app.clientEmail || 'N/A'}</p>
                    <span class="status-badge status-${statusClass}">${app.status || 'PENDING'}</span>
                </div>
                <div class="app-amount">
                    <div class="amount-requested">$${(app.desiredAmount || 0).toLocaleString()}</div>
                    <div class="amount-label">Valor Solicitado</div>
                    ${app.approvedAmount ? `
                        <div class="amount-label" style="margin-top: 8px;">
                            Aprovado: <strong style="color: #2ECC71;">$${app.approvedAmount.toLocaleString()}</strong>
                        </div>
                    ` : ''}
                </div>
            </div>

            <!-- Action Panel (only for pending) -->
            ${app.status === 'PENDING' ? `
            <div class="action-panel">
                <h3><i class="fas fa-gavel"></i> Ações</h3>
                <div class="action-buttons">
                    <button class="btn btn-approve" onclick="showApprovalForm()">
                        <i class="fas fa-check"></i> Aprovar Aplicação
                    </button>
                    <button class="btn btn-reject" onclick="showRejectionForm()">
                        <i class="fas fa-times"></i> Rejeitar Aplicação
                    </button>
                </div>

                <!-- Approval Form -->
                <div id="approvalForm" class="approval-form">
                    <h4>Aprovar Aplicação</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Valor Aprovado ($)</label>
                            <input type="number" id="approvedAmount" value="${app.desiredAmount || 0}">
                        </div>
                        <div class="form-group">
                            <label>Taxa de Juros (%)</label>
                            <input type="number" id="interestRate" value="18.5" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Prazo (meses)</label>
                            <input type="number" id="term" value="24">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Observações</label>
                        <textarea id="approvalNotes" rows="3" placeholder="Observações sobre a aprovação..."></textarea>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-approve" onclick="approveApplication()">
                            <i class="fas fa-check"></i> Confirmar Aprovação
                        </button>
                        <button class="btn btn-secondary" onclick="hideForm()">Cancelar</button>
                    </div>
                </div>

                <!-- Rejection Form -->
                <div id="rejectionForm" class="approval-form">
                    <h4>Rejeitar Aplicação</h4>
                    <div class="form-group">
                        <label>Motivo da Rejeição</label>
                        <select id="rejectionReason">
                            <option value="credit_score">Score de crédito insuficiente</option>
                            <option value="income">Renda insuficiente</option>
                            <option value="documents">Documentação incompleta</option>
                            <option value="debt_ratio">Relação dívida/renda muito alta</option>
                            <option value="employment">Situação empregatícia instável</option>
                            <option value="other">Outro motivo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Observações</label>
                        <textarea id="rejectionNotes" rows="3" placeholder="Detalhes sobre a rejeição..."></textarea>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-reject" onclick="rejectApplication()">
                            <i class="fas fa-times"></i> Confirmar Rejeição
                        </button>
                        <button class="btn btn-secondary" onclick="hideForm()">Cancelar</button>
                    </div>
                </div>
            </div>
            ` : ''}

            <!-- Detail Cards -->
            <div class="detail-grid">
                <!-- Client Information -->
                <div class="detail-card">
                    <h3><i class="fas fa-user"></i> Informações do Cliente</h3>
                    <div class="detail-row">
                        <span class="detail-label">Nome</span>
                        <span class="detail-value">${app.clientName || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email</span>
                        <span class="detail-value">${app.clientEmail || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Telefone</span>
                        <span class="detail-value">${app.clientPhone || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">SSN</span>
                        <span class="detail-value">${app.clientSsn ? '***-**-' + app.clientSsn.slice(-4) : 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Endereço</span>
                        <span class="detail-value">${app.clientAddress || 'N/A'}, ${app.clientCity || ''} ${app.clientState || ''} ${app.clientZipCode || ''}</span>
                    </div>
                </div>

                <!-- Employment & Income -->
                <div class="detail-card">
                    <h3><i class="fas fa-briefcase"></i> Emprego & Renda</h3>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value">${app.employmentStatus || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Empregador</span>
                        <span class="detail-value">${app.employer || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Ocupação</span>
                        <span class="detail-value">${app.occupation || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Renda Mensal</span>
                        <span class="detail-value">$${(app.monthlyIncome || 0).toLocaleString()}</span>
                    </div>
                </div>

                <!-- Loan Details -->
                <div class="detail-card">
                    <h3><i class="fas fa-dollar-sign"></i> Detalhes do Empréstimo</h3>
                    <div class="detail-row">
                        <span class="detail-label">Valor Solicitado</span>
                        <span class="detail-value">$${(app.desiredAmount || 0).toLocaleString()}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Finalidade</span>
                        <span class="detail-value">${app.purpose || 'N/A'}</span>
                    </div>
                    ${app.approvedAmount ? `
                    <div class="detail-row">
                        <span class="detail-label">Valor Aprovado</span>
                        <span class="detail-value" style="color: #2ECC71;">$${app.approvedAmount.toLocaleString()}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Taxa de Juros</span>
                        <span class="detail-value">${app.approvedInterestRate || 0}%</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Prazo</span>
                        <span class="detail-value">${app.approvedTerm || 0} meses</span>
                    </div>
                    ` : ''}
                </div>

                <!-- Partner -->
                <div class="detail-card">
                    <h3><i class="fas fa-handshake"></i> Parceiro</h3>
                    <div class="detail-row">
                        <span class="detail-label">Nome</span>
                        <span class="detail-value">${app.partner?.tradeName || app.partner?.companyName || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email</span>
                        <span class="detail-value">${app.partner?.email || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Telefone</span>
                        <span class="detail-value">${app.partner?.phone || 'N/A'}</span>
                    </div>
                </div>
            </div>

            <!-- Documents -->
            ${app.documents && app.documents.length > 0 ? `
            <div class="detail-card">
                <h3><i class="fas fa-file-alt"></i> Documentos</h3>
                <div class="documents-list">
                    ${app.documents.map(doc => `
                        <div class="document-item">
                            <div class="document-info">
                                <div class="document-icon">
                                    <i class="fas fa-file-pdf"></i>
                                </div>
                                <div>
                                    <strong>${doc.type || 'Documento'}</strong>
                                    <br><small>${doc.uploadedAt ? new Date(doc.uploadedAt).toLocaleDateString() : ''}</small>
                                </div>
                            </div>
                            <span class="document-status doc-${(doc.status || 'pending').toLowerCase()}">${doc.status || 'PENDING'}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
            ` : ''}

            <!-- Back Button -->
            <div style="margin-top: 24px;">
                <a href="/admin-panel/admin/admin-aplicacoes.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Voltar para Aplicações
                </a>
            </div>
        `;
    }

    function showApprovalForm() {
        document.getElementById('approvalForm').classList.add('active');
        document.getElementById('rejectionForm').classList.remove('active');
    }

    function showRejectionForm() {
        document.getElementById('rejectionForm').classList.add('active');
        document.getElementById('approvalForm').classList.remove('active');
    }

    function hideForm() {
        document.getElementById('approvalForm').classList.remove('active');
        document.getElementById('rejectionForm').classList.remove('active');
    }

    async function approveApplication() {
        const approvedAmount = document.getElementById('approvedAmount').value;
        const interestRate = document.getElementById('interestRate').value;
        const term = document.getElementById('term').value;
        const notes = document.getElementById('approvalNotes').value;

        if (!confirm('Confirma a aprovação desta aplicação?')) return;

        try {
            const response = await fetch(`${API_URL}/api/admin/applications/${appId}/approve`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approvedAmount, interestRate, term, notes })
            });

            const data = await response.json();

            if (data.success) {
                alert('Aplicação aprovada com sucesso!');
                loadApplication();
            } else {
                alert(data.error || 'Erro ao aprovar');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Erro ao aprovar aplicação');
        }
    }

    async function rejectApplication() {
        const reason = document.getElementById('rejectionReason').value;
        const notes = document.getElementById('rejectionNotes').value;

        if (!confirm('Confirma a rejeição desta aplicação?')) return;

        try {
            const response = await fetch(`${API_URL}/api/admin/applications/${appId}/reject`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reason, notes })
            });

            const data = await response.json();

            if (data.success) {
                alert('Aplicação rejeitada');
                loadApplication();
            } else {
                alert(data.error || 'Erro ao rejeitar');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Erro ao rejeitar aplicação');
        }
    }

    // Load on page load
    loadApplication();
    </script>
</body>
</html>
