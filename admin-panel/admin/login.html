<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXCREDI Admin - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2ECC71 0%, #27ae60 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #2ECC71;
            font-size: 32px;
            font-weight: 700;
        }
        
        .logo p {
            color: #7F8C8D;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
            font-size: 14px;
        }
        
        .input-group {
            position: relative;
        }
        
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 14px 45px 14px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #2ECC71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
        }
        
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #7F8C8D;
            padding: 5px;
            line-height: 1;
        }
        
        .toggle-password:hover {
            color: #2ECC71;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .remember-me input[type="checkbox"] {
            width: auto;
        }
        
        a {
            color: #2ECC71;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: #2ECC71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }
        
        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }
        
        .dev-mode {
            margin-top: 20px;
            padding: 16px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            font-size: 13px;
        }
        
        .dev-mode strong {
            color: #856404;
            display: block;
            margin-bottom: 8px;
        }
        
        .credentials {
            font-family: 'Courier New', monospace;
            background: white;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1>FLEXCREDI</h1>
            <p>Painel Administrativo</p>
        </div>
        
        <div id="alertBox" class="alert"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email<gt;Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="seu@email.com"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <div class="input-group">
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="Digite sua senha"
                        required
                    >
                    <button 
                        type="button" 
                        class="toggle-password" 
                        onclick="togglePasswordVisibility()"
                    >
                        👁️
                    </button>
                </div>
            </div>
            
            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span>Lembrar-me</span>
                </label>
                <a href="#" onclick="alert('Funcionalidade em desenvolvimento'); return false;">Esqueceu a senha?</a>
            </div>
            
            <button type="submit" id="btnLogin">Entrar</button>
        </form>
        
        <div class="dev-mode">
            <strong>🔧 MODO DESENVOLVIMENTO</strong>
            <div class="credentials">
                📧 Email: <strong>admin@flexcredi.com</strong><br>
                🔒 Senha: <strong>admin123</strong>
            </div>
        </div>
    </div>
    
    <script>
        // ============================================
        // GLOBAL CONFIG
        // ============================================
        const DEV_MODE = true;
        const MOCK_CREDENTIALS = {
            email: 'admin@flexcredi.com',
            password: 'admin123'
        };
        
        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function showAlert(message, type = 'info') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert ${type} show`;
            
            console.log(`[ALERT ${type.toUpperCase()}] ${message}`);
        }
        
        function hideAlert() {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = 'alert';
        }
        
        // ============================================
        // PASSWORD TOGGLE
        // ============================================
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');
            
            console.log('[TOGGLE] Clicked');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
                console.log('[TOGGLE] Password now visible');
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
                console.log('[TOGGLE] Password now hidden');
            }
        }
        
        // ============================================
        // LOGIN FUNCTION
        // ============================================
        async function handleLogin(email, password) {
            console.log('[LOGIN] Starting login process...');
            console.log('[LOGIN] Email:', email);
            console.log('[LOGIN] DEV_MODE:', DEV_MODE);
            
            if (DEV_MODE) {
                // MOCK LOGIN
                console.log('[LOGIN] Using MOCK authentication');
                
                if (email === MOCK_CREDENTIALS.email && password === MOCK_CREDENTIALS.password) {
                    console.log('[LOGIN] ✅ Mock credentials VALID');
                    
                    // Generate mock token
                    const token = 'mock-token-' + Date.now();
                    const user = {
                        id: 1,
                        name: 'Admin User',
                        email: email,
                        role: 'admin'
                    };
                    
                    // Store in localStorage
                    localStorage.setItem('adminToken', token);
                    localStorage.setItem('adminUser', JSON.stringify(user));
                    
                    console.log('[LOGIN] Token saved:', token);
                    console.log('[LOGIN] User saved:', user);
                    
                    return { success: true, user, token };
                } else {
                    console.log('[LOGIN] ❌ Invalid credentials');
                    throw new Error('Email ou senha inválidos');
                }
            } else {
                // REAL API LOGIN
                console.log('[LOGIN] Using REAL API authentication');
                
                const response = await fetch('https://flexcredi-site-adm-production-b27d.up.railway.app/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Erro ao fazer login');
                }
                
                const data = await response.json();
                
                // Store token
                localStorage.setItem('adminToken', data.token);
                localStorage.setItem('adminUser', JSON.stringify(data.user));
                
                return data;
            }
        }
        
        // ============================================
        // FORM HANDLER
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            console.log('[FORM] Submit triggered');
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btnLogin');
            
            // Validation
            if (!email || !password) {
                showAlert('Por favor, preencha todos os campos', 'error');
                return;
            }
            
            // Disable button
            btnLogin.disabled = true;
            btnLogin.textContent = 'Entrando...';
            hideAlert();
            
            try {
                const result = await handleLogin(email, password);
                
                console.log('[FORM] Login successful:', result);
                showAlert('Login realizado com sucesso! Redirecionando...', 'success');
                
                // Redirect after 1 second
                setTimeout(() => {
                    window.location.href = '/admin-panel/admin/dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('[FORM] Login failed:', error);
                showAlert(error.message, 'error');
                
                // Re-enable button
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar';
            }
        });
        
        // ============================================
        // INITIALIZE
        // ============================================
        console.log('='.repeat(50));
        console.log('FLEXCREDI Admin - Login System');
        console.log('='.repeat(50));
        console.log('DEV_MODE:', DEV_MODE);
        console.log('Mock Credentials:', MOCK_CREDENTIALS);
        console.log('='.repeat(50));
        
        // Check if already logged in
        const token = localStorage.getItem('adminToken');
        if (token) {
            console.log('[INIT] Already logged in, redirecting...');
            showAlert('Você já está logado! Redirecionando...', 'info');
            setTimeout(() => {
                window.location.href = '/admin-panel/admin/dashboard.html';
            }, 1000);
        }
    </script>
</body>
</html>
