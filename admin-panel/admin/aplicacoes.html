<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications - FlexCredi Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/layout-adjustments.css">
    <link rel="stylesheet" href="/css/perfect-alignment.css">
    <link rel="stylesheet" href="/css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-page">
    <!-- Header Dashboard -->
    <header class="dashboard-header" role="banner">
        <nav class="navbar container" role="navigation">
            <a href="index.html" class="navbar-brand">
                <img src="/images/flexcredi-logo-official.png" alt="FLEXCREDI - Easy, Simple, Fast" class="logo-img">
            </a>
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                <i class="fas fa-bars"></i>
            </button>
            <div class="user-menu">
                <div class="user-info">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=2ECC71&color=fff" alt="Avatar" class="user-avatar" id="userAvatar">
                    <span class="user-name" id="userName">Admin</span>
                </div>
                <div class="dropdown">
                    <button class="dropdown-toggle" type="button" id="userDropdown">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-menu">
                        <a href="#profile" class="dropdown-item"><i class="fas fa-user"></i> Meu Perfil</a>
                        <a href="admin-configuracoes.html" class="dropdown-item"><i class="fas fa-cog"></i> Configurações</a>
                        <div class="dropdown-divider"></div>
                        <a href="/login.html" class="dropdown-item"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Sidebar Admin -->
    <aside class="admin-sidebar" id="adminSidebar">
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-chart-line"></i><span>Dashboard</span>
            </a>
            <a href="aplicacoes.html" class="nav-item active">
                <i class="fas fa-file-invoice"></i><span>Applications</span>
            </a>
            <a href="clientes.html" class="nav-item">
                <i class="fas fa-users"></i><span>Clients</span>
            </a>
            <a href="admin-parceiros.html" class="nav-item">
                <i class="fas fa-handshake"></i><span>Partners</span>
            </a>
            <a href="admin-documentos.html" class="nav-item">
                <i class="fas fa-folder"></i><span>Documents</span>
            </a>
            <a href="admin-contratos.html" class="nav-item">
                <i class="fas fa-file-contract"></i><span>Contracts</span>
            </a>
            <a href="admin-pagamentos.html" class="nav-item">
                <i class="fas fa-credit-card"></i><span>ACH Payments</span>
            </a>
            <a href="admin-recebiveis.html" class="nav-item">
                <i class="fas fa-calendar-alt"></i><span>Receivables</span>
            </a>
            <a href="admin-agentes.html" class="nav-item">
                <i class="fas fa-robot"></i><span>Agents</span>
            </a>
            <a href="admin-configuracoes.html" class="nav-item">
                <i class="fas fa-cog"></i><span>Settings</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="admin-main-content">
        <div class="container-fluid">
            <!-- Page Header -->
            <div class="page-header" style="margin-bottom: 30px;">
                <h1 style="font-size: 28px; font-weight: 700; color: #343A40; margin-bottom: 8px;">
                    <i class="fas fa-file-invoice" style="color: #2ECC71;"></i> Gestão de Aplicações
                </h1>
                <p style="color: #6C757D; font-size: 14px;">Visualize e gerencie todas as aplicações de financiamento</p>
            </div>

            <!-- Filtros -->
            <div class="content-section" style="margin-bottom: 30px;">
                <div class="section-header">
                    <h2 class="section-title">
                        <i class="fas fa-filter"></i> Filtros de Busca
                    </h2>
                </div>
                <div style="padding: 20px;">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        <div>
                            <label style="display: block; font-size: 13px; font-weight: 600; color: #6C757D; margin-bottom: 6px;">Buscar<gt;Search</label>
                            <input type="text" id="searchInput" placeholder="Nome do cliente..." style="width: 100%; padding: 10px 12px; border: 1px solid #E5E7EB; border-radius: 8px; font-size: 14px;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 13px; font-weight: 600; color: #6C757D; margin-bottom: 6px;">Status<gt;Status</label>
                            <select id="statusFilter" style="width: 100%; padding: 10px 12px; border: 1px solid #E5E7EB; border-radius: 8px; font-size: 14px;">
                                <option value="">Todos<gt;All</option>
                                <option value="PENDING">Pendente<gt;Pending</option>
                                <option value="APPROVED">Aprovado<gt;Approved</option>
                                <option value="REJECTED">Rejeitado<gt;Rejected</option>
                            </select>
                        </div>
                        <div>
                            <label style="display: block; font-size: 13px; font-weight: 600; color: #6C757D; margin-bottom: 6px;">Período</label>
                            <select id="periodFilter" style="width: 100%; padding: 10px 12px; border: 1px solid #E5E7EB; border-radius: 8px; font-size: 14px;">
                                <option value="">Todo período</option>
                                <option value="today">Hoje</option>
                                <option value="week">Última semana</option>
                                <option value="month">Último mês</option>
                            </select>
                        </div>
                        <div style="display: flex; align-items: flex-end;">
                            <button onclick="applyFilters()" style="width: 100%; padding: 10px 16px; background: #2ECC71; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.3s;">
                                <i class="fas fa-search"></i> Buscar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lista de Aplicações -->
            <div class="content-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <i class="fas fa-list"></i> Lista de Aplicações (<span id="totalCount">0</span>)
                    </h2>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-primary" onclick="debugLocalStorage()" style="background: #6C757D;">
                            <i class="fas fa-bug"></i> Debug
                        </button>
                        <button class="btn-primary" onclick="refreshData()">
                            <i class="fas fa-sync-alt"></i> Atualizar
                        </button>
                    </div>
                </div>
                
                <div id="applicationsContainer">
                    <div class="loading" style="text-align: center; padding: 60px; color: #6C757D;">
                        <div class="spinner" style="display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2ECC71; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                        <p style="margin-top: 20px; font-size: 16px;">Carregando aplicações...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/admin-panel/admin/js/cross-domain-sync.js"></script>
    <script>
        const API_BASE = 'https://flexcredi-site-adm-production-b27d.up.railway.app';
        let allApplications = [];

        async function loadApplications() {
            console.log('🔄 Loading applications...');
            
            // Try to fetch from API first
            try {
                console.log('📡 Fetching from API:', `${API_BASE}/api/admin/applications`);
                const response = await fetch(`${API_BASE}/api/admin/applications`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                
                if (!response.ok) {
                    console.log(`⚠️ API endpoint not available (${response.status}), skipping...`);
                    allApplications = [];
                } else {
                    const data = await response.json();
                    
                    if (data.success && data.applications) {
                        allApplications = data.applications;
                        console.log(`✅ Loaded ${allApplications.length} applications from API`);
                    } else {
                        allApplications = [];
                        console.log('⚠️ No applications from API');
                    }
                }
            } catch (error) {
                console.log('⚠️ API endpoint error, skipping:', error.message);
                allApplications = [];
            }
            
            // Load test applications from API
            try {
                console.log('📡 Fetching test applications from API...');
                const testResponse = await fetch(`${API_BASE}/api/test-data/applications`);
                const testData = await testResponse.json();
                
                if (testData.success && testData.data) {
                    console.log(`✅ Loaded ${testData.data.length} test applications from API`);
                    allApplications = [...allApplications, ...testData.data];
                } else {
                    console.log('⚠️ No test applications from API');
                }
            } catch (error) {
                console.log('⚠️ Test data API not available:', error.message);
            }
            
            // Also load test applications from localStorage (fallback)
            try {
                console.log('💾 Checking localStorage for test applications...');
                const testApplications = JSON.parse(localStorage.getItem('flexcredi_test_applications') || '[]');
                console.log(`📦 Found ${testApplications.length} test applications in localStorage`);
                
                if (testApplications.length > 0) {
                    console.log('Test applications:', testApplications);
                    
                    // Only add localStorage applications if not already from API
                    const apiApplicationIds = new Set(allApplications.map(app => app.id));
                    const uniqueLocalApps = testApplications.filter(app => !apiApplicationIds.has(app.id));
                    
                    if (uniqueLocalApps.length > 0) {
                        console.log(`➕ Adding ${uniqueLocalApps.length} unique applications from localStorage`);
                        allApplications = [...allApplications, ...uniqueLocalApps];
                    }
                }
                
                console.log(`✅ Total: ${allApplications.length} applications`);
            } catch (error) {
                console.error('❌ Error loading test applications:', error);
            }
            
            // Render all applications
            if (allApplications.length > 0) {
                console.log('🎨 Rendering applications...', allApplications);
                renderApplications(allApplications);
                document.getElementById('totalCount').textContent = allApplications.length;
            } else {
                console.log('📭 No applications to show, displaying empty state');
                console.log('Debug info:');
                console.log('- localStorage keys:', Object.keys(localStorage));
                console.log('- flexcredi_test_applications:', localStorage.getItem('flexcredi_test_applications'));
                console.log('- flexcredi_test_clients:', localStorage.getItem('flexcredi_test_clients'));
                showEmptyState();
            }
        }

        function renderApplications(applications) {
            const container = document.getElementById('applicationsContainer');
            
            if (applications.length === 0) {
                showEmptyState();
                return;
            }

            const tableHTML = `
                <table class="applications-table" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background: #F8FAFC; border-bottom: 2px solid #E5E7EB;">
                            <th style="padding: 12px 20px; text-align: left; font-size: 12px; font-weight: 600; color: #6C757D; text-transform: uppercase;">ID</th>
                            <th style="padding: 12px 20px; text-align: left; font-size: 12px; font-weight: 600; color: #6C757D; text-transform: uppercase;">Cliente</th>
                            <th style="padding: 12px 20px; text-align: left; font-size: 12px; font-weight: 600; color: #6C757D; text-transform: uppercase;">Parceiro</th>
                            <th style="padding: 12px 20px; text-align: left; font-size: 12px; font-weight: 600; color: #6C757D; text-transform: uppercase;">Valor<gt;Amount</th>
                            <th style="padding: 12px 20px; text-align: left; font-size: 12px; font-weight: 600; color: #6C757D; text-transform: uppercase;">Status<gt;Status</th>
                            <th style="padding: 12px 20px; text-align: left; font-size: 12px; font-weight: 600; color: #6C757D; text-transform: uppercase;">Data<gt;Date</th>
                            <th style="padding: 12px 20px; text-align: left; font-size: 12px; font-weight: 600; color: #6C757D; text-transform: uppercase;">Ações<gt;Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${applications.map(app => `
                            <tr style="border-bottom: 1px solid #F1F3F4;">
                                <td style="padding: 14px 20px; font-size: 14px; color: #343A40;">
                                    <div style="display: flex; align-items: center; gap: 6px;">
                                        <span>#${app.id.substring(0, 15)}${app.id.length > 15 ? '...' : ''}</span>
                                        ${app.isTestApplication ? '<span style="background: #667eea; color: white; font-size: 9px; font-weight: 600; padding: 2px 5px; border-radius: 3px;">TEST</span>' : ''}
                                    </div>
                                </td>
                                <td style="padding: 14px 20px;">
                                    <div style="font-weight: 600; color: #343A40; margin-bottom: 2px;">${app.clientName || 'N/A'}</div>
                                    <div style="font-size: 12px; color: #6C757D;">${app.clientEmail || ''}</div>
                                </td>
                                <td style="padding: 14px 20px; font-size: 14px; color: #343A40;">${app.partnerName || 'N/A'}</td>
                                <td style="padding: 14px 20px; font-size: 15px; font-weight: 600; color: #2ECC71;">$${(app.amount || 0).toLocaleString()}</td>
                                <td style="padding: 14px 20px;">${getStatusBadge(app.status)}</td>
                                <td style="padding: 14px 20px; font-size: 13px; color: #6C757D;">${formatDate(app.createdAt)}</td>
                                <td style="padding: 14px 20px;">
                                    <div style="display: flex; gap: 8px;">
                                        <button onclick="window.open('view-application.html?id=${app.id}&source=aplicacoes', '_blank')" style="padding: 6px 12px; background: #0066CC; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;" title="View Full Application">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        ${app.status === 'PENDING' ? `
                                            <button onclick="approveApplication('${app.id}')" style="padding: 6px 12px; background: #2ECC71; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;" title="Approve Application">
                                                <i class="fas fa-check"></i>
                                            </button>
                                            <button onclick="rejectApplication('${app.id}')" style="padding: 6px 12px; background: #DC3545; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;" title="Reject Application">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        ` : ''}
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            container.innerHTML = tableHTML;
        }

        function getStatusBadge(status) {
            const statusMap = {
                'PENDING': { color: '#F59E0B', bg: 'rgba(245, 158, 11, 0.1)', label: 'Pendente' },
                'APPROVED': { color: '#2ECC71', bg: 'rgba(46, 204, 113, 0.1)', label: 'Aprovado' },
                'REJECTED': { color: '#DC3545', bg: 'rgba(220, 53, 69, 0.1)', label: 'Rejeitado' }
            };
            const s = statusMap[status] || statusMap['PENDING'];
            return `<span style="display: inline-block; padding: 6px 12px; background: ${s.bg}; color: ${s.color}; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase;">${s.label}</span>`;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR');
        }

        function showEmptyState() {
            document.getElementById('applicationsContainer').innerHTML = `
                <div style="text-align: center; padding: 60px; color: #6C757D;">
                    <i class="fas fa-inbox" style="font-size: 64px; color: #E5E7EB; margin-bottom: 20px;"></i>
                    <h3 style="font-size: 20px; color: #343A40; margin-bottom: 10px;">Nenhuma aplicação encontrada</h3>
                    <p style="font-size: 14px; margin-bottom: 20px;">As aplicações aparecerão aqui quando forem criadas.</p>
                    
                    <div style="background: #FEF3C7; border: 2px solid #F59E0B; border-radius: 8px; padding: 20px; margin: 20px auto; max-width: 500px; text-align: left;">
                        <div style="font-weight: 600; color: #92400E; margin-bottom: 12px;">
                            <i class="fas fa-info-circle"></i> Para testar o sistema:
                        </div>
                        <ol style="color: #78350F; font-size: 13px; margin: 0; padding-left: 20px;">
                            <li style="margin-bottom: 8px;">Clique no botão abaixo para criar um cliente de teste</li>
                            <li style="margin-bottom: 8px;">Após criar, volte para esta página</li>
                            <li>A aplicação do cliente aparecerá nesta lista</li>
                        </ol>
                        <a href="create-test-client.html" 
                           style="display: inline-block; margin-top: 16px; background: #F59E0B; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.2s;">
                            <i class="fas fa-plus-circle"></i> Criar Cliente de Teste
                        </a>
                    </div>
                </div>
            `;
        }

        function showError() {
            document.getElementById('applicationsContainer').innerHTML = `
                <div style="text-align: center; padding: 60px; color: #DC3545;">
                    <i class="fas fa-exclamation-circle" style="font-size: 64px; margin-bottom: 20px;"></i>
                    <h3 style="font-size: 20px; margin-bottom: 10px;">Erro ao carregar dados</h3>
                    <p style="font-size: 14px;">Não foi possível conectar à API.</p>
                    <button onclick="loadApplications()" style="margin-top: 20px; padding: 10px 20px; background: #2ECC71; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                        <i class="fas fa-redo"></i> Tentar Novamente
                    </button>
                </div>
            `;
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            
            let filtered = allApplications.filter(app => {
                const matchSearch = !search || (app.clientName && app.clientName.toLowerCase().includes(search));
                const matchStatus = !status || app.status === status;
                return matchSearch && matchStatus;
            });
            
            renderApplications(filtered);
            document.getElementById('totalCount').textContent = filtered.length;
        }

        function viewApplication(id) {
            alert(`Ver detalhes da aplicação #${id} - Funcionalidade em desenvolvimento`);
        }

        function approveApplication(id) {
            if (confirm('Tem certeza que deseja aprovar esta aplicação?')) {
                alert(`Aplicação #${id} aprovada - Funcionalidade em desenvolvimento`);
            }
        }

        function rejectApplication(id) {
            if (confirm('Tem certeza que deseja rejeitar esta aplicação?')) {
                alert(`Aplicação #${id} rejeitada - Funcionalidade em desenvolvimento`);
            }
        }

        function refreshData() {
            loadApplications();
        }
        
        function debugLocalStorage() {
            console.log('=== DEBUG LOCALSTORAGE ===');
            console.log('All localStorage keys:', Object.keys(localStorage));
            
            const testApps = localStorage.getItem('flexcredi_test_applications');
            console.log('flexcredi_test_applications raw:', testApps);
            
            if (testApps) {
                try {
                    const parsed = JSON.parse(testApps);
                    console.log('Parsed test applications:', parsed);
                    console.log('Count:', parsed.length);
                } catch (e) {
                    console.error('Error parsing:', e);
                }
            } else {
                console.log('⚠️ flexcredi_test_applications not found in localStorage');
            }
            
            const testClients = localStorage.getItem('flexcredi_test_clients');
            console.log('flexcredi_test_clients raw:', testClients);
            
            if (testClients) {
                try {
                    const parsed = JSON.parse(testClients);
                    console.log('Parsed test clients:', parsed);
                    console.log('Count:', parsed.length);
                } catch (e) {
                    console.error('Error parsing:', e);
                }
            }
            
            alert('Debug info printed to console (F12)');
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            loadApplications();
        });
    </script>
    
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
