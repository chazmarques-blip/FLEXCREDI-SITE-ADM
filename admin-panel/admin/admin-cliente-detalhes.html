<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Cliente - FlexCredi Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/admin-panel/css/admin.css">
    <style>
        .client-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
            padding: 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .client-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
        .client-info h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: #1a1a1a;
        }
        .client-info p {
            margin: 0;
            color: #666;
        }
        .client-status {
            margin-left: auto;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }
        .client-status.active {
            background: rgba(39, 174, 96, 0.1);
            color: #27ae60;
        }
        .client-status.inactive {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }
        .detail-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .detail-card h3 {
            margin: 0 0 20px 0;
            font-size: 16px;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-card h3 i {
            color: #2ECC71;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            color: #666;
            font-size: 14px;
        }
        .detail-value {
            font-weight: 500;
            color: #1a1a1a;
        }
        .applications-table {
            width: 100%;
            border-collapse: collapse;
        }
        .applications-table th,
        .applications-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        .applications-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .status-active { background: #cce5ff; color: #004085; }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #2ECC71;
            color: white;
        }
        .btn-primary:hover {
            background: #27ae60;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #666;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-link:hover {
            color: #2ECC71;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        .error-state {
            text-align: center;
            padding: 60px;
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <img src="/assets/img/logo-flexcredi.png" alt="FlexCredi" class="sidebar-logo">
            </div>
            <nav class="sidebar-nav">
                <a href="/admin-panel/admin/admin-dashboard.html" class="nav-item">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="/admin-panel/admin/admin-aplicacoes.html" class="nav-item">
                    <i class="fas fa-file-alt"></i> Applications
                </a>
                <a href="/admin-panel/admin/admin-clientes.html" class="nav-item active">
                    <i class="fas fa-users"></i> Clients
                </a>
                <a href="/admin-panel/admin/admin-partners.html" class="nav-item">
                    <i class="fas fa-handshake"></i> Partners
                </a>
                <a href="/admin-panel/admin/admin-documents.html" class="nav-item">
                    <i class="fas fa-folder"></i> Documents
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <button class="mobile-menu-toggle" id="mobileMenuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="header-user">
                    <div class="user-avatar">AD</div>
                    <span>Admin</span>
                </div>
            </header>

            <div class="admin-content">
                <a href="/admin-panel/admin/admin-clientes.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Voltar para Clientes
                </a>

                <div id="clientContent">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p>Carregando dados do cliente...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
    const API_URL = 'https://flexcredi-site-adm-production-b27d.up.railway.app';
    
    // Get client ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const clientId = urlParams.get('id');

    async function loadClient() {
        if (!clientId) {
            showError('ID do cliente não fornecido');
            return;
        }

        try {
            const response = await fetch(`${API_URL}/api/admin/clients/${clientId}`);
            const data = await response.json();

            if (!data.success) {
                throw new Error(data.error || 'Erro ao carregar cliente');
            }

            renderClient(data.client);
        } catch (error) {
            console.error('Error:', error);
            showError(error.message);
        }
    }

    function showError(message) {
        document.getElementById('clientContent').innerHTML = `
            <div class="error-state">
                <i class="fas fa-exclamation-triangle fa-3x"></i>
                <p>${message}</p>
                <a href="/admin-panel/admin/admin-clientes.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
            </div>
        `;
    }

    function renderClient(client) {
        const isActive = client.active || client.status === 'ACTIVE';
        
        document.getElementById('clientContent').innerHTML = `
            <!-- Client Header -->
            <div class="client-header">
                <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(client.name || 'Client')}&size=80&background=2ECC71&color=fff" 
                     alt="${client.name}" class="client-avatar">
                <div class="client-info">
                    <h1>${client.name || 'N/A'}</h1>
                    <p><i class="fas fa-envelope"></i> ${client.email || 'N/A'}</p>
                    <p><i class="fas fa-phone"></i> ${client.phone || 'N/A'}</p>
                </div>
                <span class="client-status ${isActive ? 'active' : 'inactive'}">
                    <i class="fas fa-${isActive ? 'check-circle' : 'times-circle'}"></i>
                    ${isActive ? 'Ativo' : 'Inativo'}
                </span>
            </div>

            <!-- Detail Cards -->
            <div class="detail-grid">
                <!-- Personal Information -->
                <div class="detail-card">
                    <h3><i class="fas fa-user"></i> Informações Pessoais</h3>
                    <div class="detail-row">
                        <span class="detail-label">Nome Completo</span>
                        <span class="detail-value">${client.name || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email</span>
                        <span class="detail-value">${client.email || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Telefone</span>
                        <span class="detail-value">${client.phone || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">SSN</span>
                        <span class="detail-value">${client.ssn ? '***-**-' + client.ssn.slice(-4) : 'N/A'}</span>
                    </div>
                </div>

                <!-- Address -->
                <div class="detail-card">
                    <h3><i class="fas fa-map-marker-alt"></i> Endereço</h3>
                    <div class="detail-row">
                        <span class="detail-label">Endereço</span>
                        <span class="detail-value">${client.address || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Cidade</span>
                        <span class="detail-value">${client.city || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Estado</span>
                        <span class="detail-value">${client.state || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">CEP</span>
                        <span class="detail-value">${client.zipCode || 'N/A'}</span>
                    </div>
                </div>

                <!-- Employment -->
                <div class="detail-card">
                    <h3><i class="fas fa-briefcase"></i> Emprego & Renda</h3>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value">${client.employmentStatus || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Empregador</span>
                        <span class="detail-value">${client.employer || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Ocupação</span>
                        <span class="detail-value">${client.occupation || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Renda Mensal</span>
                        <span class="detail-value">$${(client.monthlyIncome || 0).toLocaleString()}</span>
                    </div>
                </div>

                <!-- Account Info -->
                <div class="detail-card">
                    <h3><i class="fas fa-info-circle"></i> Informações da Conta</h3>
                    <div class="detail-row">
                        <span class="detail-label">ID</span>
                        <span class="detail-value">${client.id ? client.id.substring(0, 8) : 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Cadastro</span>
                        <span class="detail-value">${client.createdAt ? new Date(client.createdAt).toLocaleDateString('pt-BR') : 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email Verificado</span>
                        <span class="detail-value">${client.emailVerified ? 'Sim' : 'Não'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Aplicações</span>
                        <span class="detail-value">${client._count?.applications || 0}</span>
                    </div>
                </div>
            </div>

            <!-- Applications -->
            ${client.applications && client.applications.length > 0 ? `
            <div class="detail-card">
                <h3><i class="fas fa-file-alt"></i> Aplicações de Crédito</h3>
                <table class="applications-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Valor</th>
                            <th>Status</th>
                            <th>Data</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${client.applications.map(app => `
                            <tr>
                                <td>#${app.id.substring(0, 8)}</td>
                                <td>$${(app.desiredAmount || 0).toLocaleString()}</td>
                                <td><span class="status-badge status-${(app.status || 'pending').toLowerCase()}">${app.status || 'PENDING'}</span></td>
                                <td>${app.createdAt ? new Date(app.createdAt).toLocaleDateString('pt-BR') : 'N/A'}</td>
                                <td>
                                    <a href="/admin-panel/admin/admin-aplicacao-detalhes.html?id=${app.id}" class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">
                                        <i class="fas fa-eye"></i> Ver
                                    </a>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
            ` : ''}

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="window.location.href='/admin-panel/admin/admin-clientes.html'">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
                <button class="btn ${isActive ? 'btn-danger' : 'btn-primary'}" onclick="toggleStatus('${client.id}', ${!isActive})">
                    <i class="fas fa-${isActive ? 'ban' : 'check'}"></i> 
                    ${isActive ? 'Desativar Cliente' : 'Ativar Cliente'}
                </button>
            </div>
        `;
    }

    async function toggleStatus(id, active) {
        if (!confirm(`Tem certeza que deseja ${active ? 'ativar' : 'desativar'} este cliente?`)) {
            return;
        }

        try {
            const response = await fetch(`${API_URL}/api/admin/clients/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ active })
            });

            const data = await response.json();

            if (data.success) {
                alert(data.message);
                loadClient(); // Reload
            } else {
                alert(data.error || 'Erro ao atualizar status');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Erro ao atualizar status');
        }
    }

    // Load on page load
    loadClient();
    </script>
</body>
</html>
