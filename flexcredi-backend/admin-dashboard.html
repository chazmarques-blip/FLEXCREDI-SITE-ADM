<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎛️ FLEXCREDI - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            text-align: center;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card i {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .stat-card.applications i { color: #3498db; }
        .stat-card.users i { color: #2ecc71; }
        .stat-card.pending i { color: #f39c12; }
        .stat-card.approved i { color: #27ae60; }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #7f8c8d;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .main-section {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .section-title {
            color: #2c3e50;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        
        .btn {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .btn.success { background: linear-gradient(45deg, #2ecc71, #27ae60); }
        .btn.warning { background: linear-gradient(45deg, #f39c12, #e67e22); }
        .btn.danger { background: linear-gradient(45deg, #e74c3c, #c0392b); }
        .btn.small { padding: 8px 15px; font-size: 0.8rem; }
        
        .applications-table {
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        
        .applications-table th {
            background: linear-gradient(45deg, #34495e, #2c3e50);
            color: white;
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .applications-table td {
            padding: 12px;
            border-bottom: 1px solid #ecf0f1;
            font-size: 0.9rem;
        }
        
        .applications-table tr:hover {
            background: #f8f9fa;
        }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-pending { background: #fef3cd; color: #856404; }
        .status-approved { background: #d1ecf1; color: #0c5460; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }
        
        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .status-online {
            background: #d4edda;
            color: #155724;
        }
        
        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            .header { flex-direction: column; gap: 15px; text-align: center; }
            .header h1 { font-size: 1.5rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .action-buttons { justify-content: center; }
            .section-header { flex-direction: column; gap: 15px; }
            .applications-table { font-size: 0.8rem; }
            .applications-table th,
            .applications-table td { padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1><i class="fas fa-chart-line"></i> FLEXCREDI Admin Dashboard</h1>
                <p style="color: #7f8c8d; margin-top: 5px;">Sistema de Gestão Administrativo - Crédito Digital</p>
            </div>
            <div class="header-actions">
                <span id="connection-status" class="connection-status status-offline">
                    <i class="fas fa-circle"></i> Verificando...
                </span>
                <a href="index.html" class="btn small">
                    <i class="fas fa-home"></i> Site
                </a>
            </div>
        </header>
        
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card applications">
                <i class="fas fa-file-alt"></i>
                <div class="stat-number" id="total-applications">-</div>
                <div class="stat-label">Total Aplicações</div>
            </div>
            
            <div class="stat-card users">
                <i class="fas fa-users"></i>
                <div class="stat-number" id="total-users">-</div>
                <div class="stat-label">Usuários Ativos</div>
            </div>
            
            <div class="stat-card pending">
                <i class="fas fa-clock"></i>
                <div class="stat-number" id="pending-applications">-</div>
                <div class="stat-label">Pendentes</div>
            </div>
            
            <div class="stat-card approved">
                <i class="fas fa-check-circle"></i>
                <div class="stat-number" id="approved-applications">-</div>
                <div class="stat-label">Aprovadas</div>
            </div>
        </div>
        
        <div class="main-section">
            <div class="section-header">
                <h2 class="section-title"><i class="fas fa-cogs"></i> Painel de Controle</h2>
            </div>
            
            <div class="action-buttons">
                <button class="btn success" onclick="atualizarDados()">
                    <i class="fas fa-sync"></i> Atualizar Dados
                </button>
                <button class="btn warning" onclick="criarAplicacaoTeste()">
                    <i class="fas fa-plus"></i> Criar Aplicação Teste
                </button>
                <button class="btn" onclick="carregarAplicacoes()">
                    <i class="fas fa-list"></i> Carregar Aplicações
                </button>
                <button class="btn danger" onclick="testarConexao()">
                    <i class="fas fa-wifi"></i> Testar Backend
                </button>
            </div>
            
            <div id="status-message"></div>
            
            <div class="section-header">
                <h3 class="section-title"><i class="fas fa-table"></i> Aplicações de Crédito</h3>
                <button class="btn small" onclick="exportarDados()">
                    <i class="fas fa-download"></i> Exportar
                </button>
            </div>
            
            <div id="applications-container">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Carregando aplicações...
                </div>
            </div>
        </div>
    </div>

    <!-- Config API -->
    <script src="../js/config.js"></script>
    
    <script>
        // CONFIGURAÇÃO DA API - Agora usando configuração dinâmica
        const API_BASE = window.FLEXCREDI_API.config.baseURL;
        
        function showMessage(message, type = 'success') {
            const container = document.getElementById('status-message');
            container.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }
        
        function updateConnectionStatus(online) {
            const status = document.getElementById('connection-status');
            if (online) {
                status.className = 'connection-status status-online';
                status.innerHTML = '<i class="fas fa-circle"></i> Online';
            } else {
                status.className = 'connection-status status-offline';
                status.innerHTML = '<i class="fas fa-circle"></i> Offline';
            }
        }
        
        async function testarConexao() {
            try {
                showMessage('<i class="fas fa-wifi fa-pulse"></i> Testando conexão com backend...', 'info');
                
                const response = await fetch(`${API_BASE}/`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                updateConnectionStatus(true);
                showMessage(`✅ Backend conectado! Status: ${data.status}`, 'success');
                
                return true;
            } catch (error) {
                updateConnectionStatus(false);
                showMessage(`❌ Erro de conexão: ${error.message}<br><small>Certifique-se de que o backend está rodando na porta 3001</small>`, 'error');
                return false;
            }
        }
        
        async function atualizarDados() {
            try {
                showMessage '<i class="fas fa-sync fa-spin"></i> Atualizando estatísticas...', 'info');
                
                const response = await fetch(`${API_BASE}/api/dashboard`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('total-applications').textContent = data.stats?.totalApplications || 0;
                    document.getElementById('total-users').textContent = data.stats?.totalUsers || 0;
                    document.getElementById('pending-applications').textContent = data.stats?.pendingApplications || 0;
                    document.getElementById('approved-applications').textContent = data.stats?.approvedApplications || 0;
                    
                    showMessage('✅ Estatísticas atualizadas com sucesso!', 'success');
                } else {
                    throw new Error('Resposta inválida do servidor');
                }
                
            } catch (error) {
                showMessage(`❌ Erro ao carregar estatísticas: ${error.message}`, 'error');
            }
        }
        
        async function carregarAplicacoes() {
            const container = document.getElementById('applications-container');
            
            try {
                container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando aplicações...</div>';
                
                const response = await fetch(`${API_BASE}/api/applications`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error('Erro na resposta do servidor');
                }
                
                const applications = data.data || [];
                
                if (applications.length === 0) {
                    container.innerHTML = `
                        <div class="message info">
                            <i class="fas fa-info-circle"></i> 
                            Nenhuma aplicação encontrada. Clique em "Criar Aplicação Teste" para adicionar dados de exemplo.
                        </div>
                    `;
                    return;
                }
                
                const tableHTML = `
                    <table class="applications-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <th>Data</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${applications.map(app => `
                                <tr>
                                    <td><code>${app.id?.substring(0,8) || 'N/A'}</code></td>
                                    <td><strong>${app.name || 'N/A'}</strong></td>
                                    <td>${app.email || 'N/A'}</td>
                                    <td><strong>R$ ${(app.desiredAmount || 0).toLocaleString('pt-BR')}</strong></td>
                                    <td><span class="status-badge status-${app.status || 'pending'}">${app.status || 'pending'}</span></td>
                                    <td>${app.createdAt ? new Date(app.createdAt).toLocaleDateString('pt-BR') : 'N/A'}</td>
                                    <td>
                                        <button class="btn small success" onclick="aprovarAplicacao('${app.id}')">
                                            <i class="fas fa-check"></i>
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                
                container.innerHTML = tableHTML;
                showMessage(`✅ ${applications.length} aplicação(ões) carregadas`, 'success');
                
            } catch (error) {
                container.innerHTML = `<div class="message error"><i class="fas fa-exclamation-triangle"></i> Erro ao carregar aplicações: ${error.message}</div>`;
            }
        }
        
        async function criarAplicacaoTeste() {
            try {
                showMessage('<i class="fas fa-plus fa-spin"></i> Criando aplicação de teste...', 'info');
                
                const nomes = ['Ana Silva', 'Carlos Oliveira', 'Maria Santos', 'João Pereira', 'Lucia Costa'];
                const propositos = ['Capital de giro', 'Expansão do negócio', 'Quitação de dívidas', 'Investimento em equipamentos', 'Reforma da casa'];
                
                const dadosTeste = {
                    name: nomes[Math.floor(Math.random() * nomes.length)],
                    email: `cliente${Date.now()}@example.com`,
                    phone: "(11) 99999-9999",
                    cpf: "123.456.789-00",
                    desiredAmount: Math.floor(Math.random() * 95000) + 5000, // Entre 5.000 e 100.000
                    purpose: propositos[Math.floor(Math.random() * propositos.length)]
                };
                
                const response = await fetch(`${API_BASE}/api/applications`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosTeste)
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(`✅ Aplicação criada: <strong>${result.application?.name}</strong> - R$ ${(result.application?.desiredAmount || 0).toLocaleString('pt-BR')}`, 'success');
                    
                    // Atualizar dados automaticamente
                    setTimeout(() => {
                        atualizarDados();
                        carregarAplicacoes();
                    }, 1000);
                } else {
                    throw new Error(result.error || 'Erro desconhecido');
                }
                
            } catch (error) {
                showMessage(`❌ Erro ao criar aplicação: ${error.message}`, 'error');
            }
        }
        
        async function aprovarAplicacao(id) {
            showMessage(`<i class="fas fa-check fa-spin"></i> Aprovando aplicação ${id}...`, 'info');
            // Simular aprovação (implementar depois)
            setTimeout(() => {
                showMessage(`✅ Aplicação ${id} aprovada com sucesso!`, 'success');
            }, 1000);
        }
        
        function exportarDados() {
            showMessage('<i class="fas fa-download fa-pulse"></i> Funcionalidade de exportação será implementada em breve...', 'info');
        }
        
        // Inicialização automática
        window.addEventListener('load', async () => {
            // Testar conexão primeiro
            const conexaoOk = await testarConexao();
            
            if (conexaoOk) {
                // Se conexão OK, carregar dados
                setTimeout(atualizarDados, 500);
                setTimeout(carregarAplicacoes, 1000);
            }
        });
        
        // Atualização automática a cada 30 segundos
        setInterval(async () => {
            if (document.getElementById('connection-status').classList.contains('status-online')) {
                await atualizarDados();
            }
        }, 30000);
    </script>
</body>
</html>
