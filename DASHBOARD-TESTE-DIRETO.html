<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎛️ DASHBOARD FLEXCREDI - TESTE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            color: white;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn.blue { background: linear-gradient(45deg, #2196F3, #1976D2); }
        .btn.orange { background: linear-gradient(45deg, #FF9800, #F57C00); }
        .btn.red { background: linear-gradient(45deg, #f44336, #d32f2f); }
        .result {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }
        .applications-table {
            width: 100%;
            background: rgba(255,255,255,0.9);
            color: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }
        .applications-table th {
            background: #333;
            color: white;
            padding: 15px;
            text-align: left;
        }
        .applications-table td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d1ecf1; color: #0c5460; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .loading { text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 FLEXCREDI Admin Dashboard</h1>
            <p>Sistema de Gestão Administrativo - Teste de Conectividade</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-apps">0</div>
                <div>Total Aplicações</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-users">0</div>
                <div>Total Usuários</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pending-apps">0</div>
                <div>Pendentes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="approved-apps">0</div>
                <div>Aprovadas</div>
            </div>
        </div>
        
        <div class="buttons">
            <button class="btn" onclick="testarConexao()">🔗 Testar Conexão Backend</button>
            <button class="btn blue" onclick="carregarStats()">📊 Carregar Estatísticas</button>
            <button class="btn orange" onclick="criarAplicacao()">➕ Criar Aplicação Teste</button>
            <button class="btn red" onclick="listarAplicacoes()">📋 Listar Aplicações</button>
        </div>
        
        <div id="result" class="result"></div>
        <div id="applications-container"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001';
        
        function showResult(content, show = true) {
            const result = document.getElementById('result');
            result.textContent = content;
            result.style.display = show ? 'block' : 'none';
        }
        
        async function testarConexao() {
            try {
                showResult('🔄 Testando conexão com o backend...');
                
                const response = await fetch(`${API_BASE}/`);
                const data = await response.json();
                
                showResult(`✅ CONEXÃO ESTABELECIDA!

Resposta do Backend:
${JSON.stringify(data, null, 2)}

Status: ${response.status}
URL: ${API_BASE}/`);
                
            } catch (error) {
                showResult(`❌ ERRO DE CONEXÃO!

Erro: ${error.message}

Verificações necessárias:
1. Backend está rodando? (deve mostrar "🚀 FLEXCREDI BACKEND INICIADO!")
2. Porta 3001 está correta?
3. Execute: cd backend && npm start

URL tentada: ${API_BASE}/`);
            }
        }
        
        async function carregarStats() {
            try {
                showResult('🔄 Carregando estatísticas...');
                
                const response = await fetch(`${API_BASE}/api/dashboard`);
                const data = await response.json();
                
                // Atualizar números na tela
                document.getElementById('total-apps').textContent = data.stats?.totalApplications || 0;
                document.getElementById('total-users').textContent = data.stats?.totalUsers || 0;
                document.getElementById('pending-apps').textContent = data.stats?.pendingApplications || 0;
                document.getElementById('approved-apps').textContent = data.stats?.approvedApplications || 0;
                
                showResult(`✅ ESTATÍSTICAS CARREGADAS!

${JSON.stringify(data, null, 2)}`);
                
            } catch (error) {
                showResult(`❌ ERRO AO CARREGAR ESTATÍSTICAS!

Erro: ${error.message}
URL: ${API_BASE}/api/dashboard`);
            }
        }
        
        async function criarAplicacao() {
            try {
                showResult('🔄 Criando aplicação de teste...');
                
                const dadosTeste = {
                    name: `Cliente Teste ${Date.now()}`,
                    email: `teste${Date.now()}@flexcredi.com`,
                    phone: "(11) 99999-9999",
                    cpf: "123.456.789-00",
                    desiredAmount: Math.floor(Math.random() * 50000) + 5000,
                    purpose: "Aplicação de teste criada via dashboard"
                };
                
                const response = await fetch(`${API_BASE}/api/applications`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosTeste)
                });
                
                const result = await response.json();
                
                showResult(`✅ APLICAÇÃO CRIADA COM SUCESSO!

Dados enviados:
${JSON.stringify(dadosTeste, null, 2)}

Resposta do servidor:
${JSON.stringify(result, null, 2)}`);
                
                // Atualizar estatísticas automaticamente
                setTimeout(carregarStats, 1000);
                
            } catch (error) {
                showResult(`❌ ERRO AO CRIAR APLICAÇÃO!

Erro: ${error.message}
URL: ${API_BASE}/api/applications`);
            }
        }
        
        async function listarAplicacoes() {
            try {
                const container = document.getElementById('applications-container');
                container.innerHTML = '<div class="loading">🔄 Carregando aplicações...</div>';
                
                const response = await fetch(`${API_BASE}/api/applications`);
                const data = await response.json();
                
                showResult(`📋 APLICAÇÕES ENCONTRADAS: ${data.data?.length || 0}

Resposta completa:
${JSON.stringify(data, null, 2)}`);
                
                const applications = data.data || [];
                
                if (applications.length === 0) {
                    container.innerHTML = '<div class="loading">📝 Nenhuma aplicação encontrada. Crie uma aplicação teste primeiro!</div>';
                    return;
                }
                
                const tableHTML = `
                    <table class="applications-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Valor Solicitado</th>
                                <th>Status</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${applications.map(app => `
                                <tr>
                                    <td>${app.id || 'N/A'}</td>
                                    <td>${app.name || 'N/A'}</td>
                                    <td>${app.email || 'N/A'}</td>
                                    <td>R$ ${(app.desiredAmount || 0).toLocaleString('pt-BR')}</td>
                                    <td><span class="status-badge status-${app.status || 'pending'}">${app.status || 'pending'}</span></td>
                                    <td>${app.createdAt ? new Date(app.createdAt).toLocaleDateString('pt-BR') : 'N/A'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                
                container.innerHTML = tableHTML;
                
            } catch (error) {
                document.getElementById('applications-container').innerHTML = 
                    `<div class="loading">❌ Erro: ${error.message}</div>`;
                showResult(`❌ ERRO AO LISTAR APLICAÇÕES!

Erro: ${error.message}
URL: ${API_BASE}/api/applications`);
            }
        }
        
        // Testar conexão automaticamente ao carregar
        window.addEventListener('load', () => {
            setTimeout(testarConexao, 500);
        });
    </script>
</body>
</html>
