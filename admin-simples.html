<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎛️ FLEXCREDI - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <script src="js/config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card i {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .stat-card.applications i { color: #3498db; }
        .stat-card.users i { color: #2ecc71; }
        .stat-card.pending i { color: #f39c12; }
        .stat-card.approved i { color: #27ae60; }
        
        .stat-number {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #7f8c8d;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .actions-section {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .btn {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
        }
        
        .btn.success { background: linear-gradient(45deg, #2ecc71, #27ae60); }
        .btn.warning { background: linear-gradient(45deg, #f39c12, #e67e22); }
        .btn.danger { background: linear-gradient(45deg, #e74c3c, #c0392b); }
        
        .applications-table {
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .applications-table th {
            background: linear-gradient(45deg, #34495e, #2c3e50);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        .applications-table td {
            padding: 15px;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-pending { background: #fef3cd; color: #856404; }
        .status-approved { background: #d1ecf1; color: #0c5460; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            .header h1 { font-size: 2rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .action-buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-chart-line"></i> FLEXCREDI Admin Dashboard</h1>
            <p>Sistema de Gestão Administrativo - Crédito Digital</p>
        </header>
        
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card applications">
                <i class="fas fa-file-alt"></i>
                <div class="stat-number" id="total-applications">-</div>
                <div class="stat-label">Total Aplicações</div>
            </div>
            
            <div class="stat-card users">
                <i class="fas fa-users"></i>
                <div class="stat-number" id="total-users">-</div>
                <div class="stat-label">Usuários Ativos</div>
            </div>
            
            <div class="stat-card pending">
                <i class="fas fa-clock"></i>
                <div class="stat-number" id="pending-applications">-</div>
                <div class="stat-label">Pendentes</div>
            </div>
            
            <div class="stat-card approved">
                <i class="fas fa-check-circle"></i>
                <div class="stat-number" id="approved-applications">-</div>
                <div class="stat-label">Aprovadas</div>
            </div>
        </div>
        
        <div class="actions-section">
            <h2 style="margin-bottom: 20px; color: #2c3e50;"><i class="fas fa-cogs"></i> Ações Rápidas</h2>
            
            <div class="action-buttons">
                <button class="btn success" onclick="carregarDados()">
                    <i class="fas fa-sync"></i> Atualizar Dados
                </button>
                <button class="btn warning" onclick="criarAplicacaoTeste()">
                    <i class="fas fa-plus"></i> Criar Aplicação Teste
                </button>
                <button class="btn" onclick="carregarAplicacoes()">
                    <i class="fas fa-list"></i> Carregar Aplicações
                </button>
                <button class="btn danger" onclick="testarConexao()">
                    <i class="fas fa-wifi"></i> Testar Conexão
                </button>
            </div>
            
            <div id="status-message"></div>
            
            <h3 style="margin: 30px 0 15px 0; color: #2c3e50;"><i class="fas fa-table"></i> Aplicações Recentes</h3>
            
            <div id="applications-container">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Carregando aplicações...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Usar configuração dinâmica ou fallback
        const API_BASE = window.FLEXCREDI_API ? window.FLEXCREDI_API.config.baseURL : 'http://localhost:3001';
        
        function showMessage(message, type = 'success') {
            const container = document.getElementById('status-message');
            container.innerHTML = `<div class="${type}">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }
        
        async function carregarDados() {
            try {
                showMessage('<i class="fas fa-sync fa-spin"></i> Carregando dados...', 'success');
                
                const response = await fetch(`${API_BASE}/api/dashboard`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                document.getElementById('total-applications').textContent = data.stats?.totalApplications || 0;
                document.getElementById('total-users').textContent = data.stats?.totalUsers || 0;
                document.getElementById('pending-applications').textContent = data.stats?.pendingApplications || 0;
                document.getElementById('approved-applications').textContent = data.stats?.approvedApplications || 0;
                
                showMessage('✅ Dados atualizados com sucesso!', 'success');
                
            } catch (error) {
                showMessage(`❌ Erro ao carregar dados: ${error.message}`, 'error');
                console.error('Erro:', error);
            }
        }
        
        async function carregarAplicacoes() {
            const container = document.getElementById('applications-container');
            
            try {
                container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando aplicações...</div>';
                
                const response = await fetch(`${API_BASE}/api/applications`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                const applications = data.data || [];
                
                if (applications.length === 0) {
                    container.innerHTML = '<div class="loading">📝 Nenhuma aplicação encontrada. Clique em "Criar Aplicação Teste" para adicionar dados.</div>';
                    return;
                }
                
                const tableHTML = `
                    <table class="applications-table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${applications.map(app => `
                                <tr>
                                    <td>${app.name || 'N/A'}</td>
                                    <td>${app.email || 'N/A'}</td>
                                    <td>R$ ${(app.desiredAmount || 0).toLocaleString()}</td>
                                    <td><span class="status-badge status-${app.status || 'pending'}">${app.status || 'pending'}</span></td>
                                    <td>${app.createdAt ? new Date(app.createdAt).toLocaleDateString() : 'N/A'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                
                container.innerHTML = tableHTML;
                showMessage(`✅ ${applications.length} aplicações carregadas`, 'success');
                
            } catch (error) {
                container.innerHTML = `<div class="error">❌ Erro ao carregar aplicações: ${error.message}</div>`;
                console.error('Erro:', error);
            }
        }
        
        async function criarAplicacaoTeste() {
            try {
                showMessage('<i class="fas fa-plus fa-spin"></i> Criando aplicação teste...', 'success');
                
                const dadosTeste = {
                    name: `Cliente Teste ${Date.now()}`,
                    email: `cliente${Date.now()}@flexcredi.com`,
                    phone: "(11) 99999-9999",
                    cpf: "123.456.789-00",
                    desiredAmount: Math.floor(Math.random() * 50000) + 5000,
                    purpose: "Teste do sistema administrativo"
                };
                
                const response = await fetch(`${API_BASE}/api/applications`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosTeste)
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                
                showMessage(`✅ Aplicação criada: ${result.application?.name} - R$ ${(result.application?.desiredAmount || 0).toLocaleString()}`, 'success');
                
                // Recarregar dados automaticamente
                setTimeout(() => {
                    carregarDados();
                    carregarAplicacoes();
                }, 1000);
                
            } catch (error) {
                showMessage(`❌ Erro ao criar aplicação: ${error.message}`, 'error');
                console.error('Erro:', error);
            }
        }
        
        async function testarConexao() {
            try {
                showMessage('<i class="fas fa-wifi fa-pulse"></i> Testando conexão...', 'success');
                
                const response = await fetch(`${API_BASE}/`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                showMessage(`✅ Conexão OK: ${data.message}`, 'success');
                
            } catch (error) {
                showMessage(`❌ Erro de conexão: ${error.message}<br><br>Verifique se o backend está rodando:<br>1. cd backend<br>2. npm start`, 'error');
                console.error('Erro:', error);
            }
        }
        
        // Carregar dados automaticamente ao abrir a página
        window.addEventListener('load', () => {
            testarConexao();
            setTimeout(carregarDados, 1000);
            setTimeout(carregarAplicacoes, 2000);
        });
    </script>
</body>
</html>
