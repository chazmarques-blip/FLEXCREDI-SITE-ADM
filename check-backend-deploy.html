<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Backend Deploy Status - FlexCredi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-weight: bold;
            text-align: center;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }
        .status.warning {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeeba;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: all 0.3s;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        pre {
            background: #1e1e1e;
            color: #dcdcdc;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
            font-size: 13px;
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            margin: 5px;
        }
        .badge.v2 {
            background: #ffc107;
            color: #333;
        }
        .badge.v3 {
            background: #28a745;
            color: white;
        }
        .progress {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Backend Deploy Status</h1>
        
        <div id="status" class="status info">
            Clique no botão para verificar o status do deploy
        </div>
        
        <div class="progress" id="progress" style="display:none;">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        
        <button onclick="checkDeploy()">🔍 Verificar Deploy do Backend</button>
        
        <div id="result"></div>
    </div>

    <script>
        const API_BASE = 'https://flexcredi-site-adm-production-b27d.up.railway.app';
        let checkInterval;
        let attempts = 0;
        const maxAttempts = 20; // 20 checks = ~2 minutes
        
        async function checkDeploy() {
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            const progressDiv = document.getElementById('progress');
            const progressBar = document.getElementById('progressBar');
            
            statusDiv.className = 'status info';
            statusDiv.textContent = '⏳ Verificando deploy do backend...';
            progressDiv.style.display = 'block';
            resultDiv.innerHTML = '';
            
            attempts = 0;
            
            checkInterval = setInterval(async () => {
                attempts++;
                const progress = (attempts / maxAttempts) * 100;
                progressBar.style.width = progress + '%';
                progressBar.textContent = Math.round(progress) + '%';
                
                try {
                    // Check 1: Is backend alive?
                    const healthCheck = await fetch(API_BASE + '/health', {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    }).catch(() => null);
                    
                    if (!healthCheck || !healthCheck.ok) {
                        statusDiv.className = 'status warning';
                        statusDiv.textContent = `⏳ Backend ainda deployando... (tentativa ${attempts}/${maxAttempts})`;
                        
                        if (attempts >= maxAttempts) {
                            clearInterval(checkInterval);
                            statusDiv.className = 'status error';
                            statusDiv.textContent = '❌ Timeout: Backend não respondeu após 2 minutos. Pode demorar mais alguns minutos.';
                        }
                        return;
                    }
                    
                    // Check 2: Test-data endpoint exists?
                    const statsResponse = await fetch(API_BASE + '/api/test-data/stats');
                    
                    if (!statsResponse.ok) {
                        throw new Error('Stats endpoint not found');
                    }
                    
                    const stats = await statsResponse.json();
                    
                    // Check 3: Is it using database?
                    if (stats.data && stats.data.storage === 'database') {
                        clearInterval(checkInterval);
                        progressBar.style.width = '100%';
                        progressBar.textContent = '100%';
                        
                        statusDiv.className = 'status success';
                        statusDiv.innerHTML = '✅ DEPLOY COMPLETO! Backend v3.3.0 com PostgreSQL ativo!';
                        
                        resultDiv.innerHTML = `
                            <div class="status success">
                                <h3>🎉 Backend Atualizado com Sucesso!</h3>
                                <p><strong>Versão:</strong> <span class="badge v3">v3.3.0 - Database</span></p>
                                <p><strong>Storage:</strong> PostgreSQL (Persistent)</p>
                                <p><strong>Clientes no DB:</strong> ${stats.data.clients}</p>
                                <p><strong>Aplicações no DB:</strong> ${stats.data.applications}</p>
                                <p><strong>Última Atualização:</strong> ${new Date(stats.data.lastUpdate).toLocaleString('pt-BR')}</p>
                            </div>
                            <pre>${JSON.stringify(stats, null, 2)}</pre>
                            <div class="status info">
                                <strong>✅ PRÓXIMOS PASSOS:</strong><br>
                                1. Vá para: <a href="https://flexcredi.com/force-sync-test-client.html" target="_blank">Force Sync Tool</a><br>
                                2. Clique em "Create Test Client"<br>
                                3. Vá para: <a href="https://flexcredi.com/dashboard-cliente.html" target="_blank">Dashboard Cliente</a><br>
                                4. Faça upload de um documento<br>
                                5. Abra: <a href="https://admin.flexcredi.com/view-application.html?id=test-client-..." target="_blank">Admin View</a><br>
                                6. ✅ Documento deve aparecer como "Uploaded"!
                            </div>
                        `;
                    } else {
                        // Old version still running
                        statusDiv.className = 'status warning';
                        statusDiv.innerHTML = `⚠️ Backend respondeu mas ainda está usando memória (v2.0). Deploy em andamento...<br><span class="badge v2">OLD VERSION</span>`;
                    }
                    
                } catch (error) {
                    console.error('Check error:', error);
                    
                    if (attempts >= maxAttempts) {
                        clearInterval(checkInterval);
                        statusDiv.className = 'status error';
                        statusDiv.textContent = '❌ Erro ao verificar deploy. Tente novamente em alguns minutos.';
                        resultDiv.innerHTML = `<pre>${error.message}</pre>`;
                    }
                }
            }, 6000); // Check every 6 seconds
        }
        
        // Auto-start check
        window.addEventListener('load', () => {
            setTimeout(() => {
                checkDeploy();
            }, 1000);
        });
    </script>
</body>
</html>
