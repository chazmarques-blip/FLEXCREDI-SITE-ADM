<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FLEXCREDI Client Login - Access your account and manage your credit applications.">
    <title>Client Login - FLEXCREDI | Easy, Simple, Fast</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/flexcredi-logo-official.png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/compact-login.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #2ECC71 0%, #27ae60 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            margin: 20px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .login-logo {
            max-width: 180px;
            margin-bottom: 20px;
        }
        
        .login-header h1 {
            color: #2ECC71;
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .login-header p {
            color: #666;
            font-size: 15px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #2ECC71;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .remember-me input[type="checkbox"] {
            width: auto;
        }
        
        .forgot-password {
            color: #2ECC71;
            text-decoration: none;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #2ECC71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-login:hover {
            background: #27ae60;
        }
        
        .btn-login:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        
        .login-divider {
            text-align: center;
            margin: 25px 0;
            color: #999;
            font-size: 14px;
        }
        
        .signup-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }
        
        .signup-link a {
            color: #2ECC71;
            text-decoration: none;
            font-weight: 600;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
        
        .back-home {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-home a {
            color: #2ECC71;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-home a:hover {
            text-decoration: underline;
        }
        
        .demo-credentials {
            background: #f8f9fa;
            border-left: 4px solid #2ECC71;
            padding: 15px;
            margin-top: 25px;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .demo-credentials strong {
            color: #2ECC71;
        }
        
        .demo-credentials p {
            margin: 5px 0;
            color: #555;
        }
    </style>
    <!-- MOBILE-FIRST & DESKTOP CLEAN -->
    <link rel="stylesheet" href="css/mobile-first.css?v=2.0.0">
    <link rel="stylesheet" href="css/desktop-clean.css?v=1.0.0">
    <link rel="stylesheet" href="css/internal-pages.css?v=1.0.0">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="images/flexcredi-logo-official.png" alt="FLEXCREDI" class="login-logo">
            <h1>Client Login</h1>
            <p>Access your account and manage your applications</p>
        </div>
        
        <form id="form-login" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="rememberMe" id="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        
        <div class="signup-link">
            Don't have an account? <a href="index.html#apply">Apply Now</a>
        </div>
        
        <div class="back-home">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
        
        <!-- Demo Credentials -->
        <div class="demo-credentials">
            <strong><i class="fas fa-info-circle"></i> Demo Access:</strong>
            <p><strong>Email:</strong> master@flexcredi.com</p>
            <p><strong>Password:</strong> flexmaster2024</p>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
