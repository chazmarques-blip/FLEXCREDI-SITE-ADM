<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicações - FlexCredi Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.test {
            background: #667eea;
            color: white;
        }
        .badge.pending {
            background: #ffc107;
            color: #333;
        }
        .badge.approved {
            background: #28a745;
            color: white;
        }
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin: 0 4px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-view {
            background: #667eea;
            color: white;
        }
        .btn-view:hover {
            background: #5568d3;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        .empty i {
            font-size: 64px;
            color: #dee2e6;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-file-alt"></i> Gestão de Aplicações</h1>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Total de Aplicações</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="dbCount">0</div>
                <div class="stat-label">No Database</div>
            </div>
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Carregando aplicações...</p>
        </div>
        
        <div id="error" style="display:none;"></div>
        
        <div id="content" style="display:none;"></div>
    </div>

    <script>
        const API_BASE = 'https://flexcredi-site-adm-production-b27d.up.railway.app';
        
        async function loadApplications() {
            console.log('🔄 Loading applications...');
            const loadingDiv = document.getElementById('loading');
            const contentDiv = document.getElementById('content');
            const errorDiv = document.getElementById('error');
            
            try {
                // Fetch from test-data API
                console.log('📡 Fetching:', `${API_BASE}/api/test-data/applications`);
                
                const response = await fetch(`${API_BASE}/api/test-data/applications`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('✅ Response:', data);
                
                const applications = data.data || [];
                console.log(`📦 Loaded ${applications.length} applications`);
                
                // Update stats
                document.getElementById('totalCount').textContent = applications.length;
                document.getElementById('dbCount').textContent = applications.length;
                
                // Hide loading
                loadingDiv.style.display = 'none';
                
                if (applications.length === 0) {
                    contentDiv.innerHTML = `
                        <div class="empty">
                            <i class="fas fa-inbox"></i>
                            <h2>Nenhuma Aplicação Encontrada</h2>
                            <p>As aplicações aparecerão aqui quando forem criadas.</p>
                        </div>
                    `;
                } else {
                    contentDiv.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Email</th>
                                    <th>Valor</th>
                                    <th>Status</th>
                                    <th>Documentos</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${applications.map(app => {
                                    const id = app.id || app.applicationId || 'N/A';
                                    const name = app.fullName || app.name || 'N/A';
                                    const email = app.email || 'N/A';
                                    const amount = app.loanAmount || app.preApproval?.amount || 0;
                                    const status = app.status || 'pending';
                                    
                                    // Count uploaded documents
                                    const docs = app.documents || {};
                                    const uploadedDocs = Object.values(docs).filter(d => d && d.uploaded).length;
                                    const totalDocs = 4; // driver, address, ssn, bank
                                    
                                    return `
                                        <tr>
                                            <td>
                                                #${id.substring(0, 12)}...
                                                <span class="badge test">TEST</span>
                                            </td>
                                            <td><strong>${name}</strong></td>
                                            <td>${email}</td>
                                            <td>$${amount.toLocaleString()}</td>
                                            <td>
                                                <span class="badge ${status === 'approved' ? 'approved' : 'pending'}">
                                                    ${status.toUpperCase()}
                                                </span>
                                            </td>
                                            <td>${uploadedDocs}/${totalDocs} documentos</td>
                                            <td>
                                                <a href="view-application.html?id=${id}&source=aplicacoes" 
                                                   class="btn btn-view" target="_blank">
                                                    <i class="fas fa-eye"></i> Ver
                                                </a>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    `;
                }
                
                contentDiv.style.display = 'block';
                
            } catch (error) {
                console.error('❌ Error:', error);
                loadingDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.className = 'error';
                errorDiv.innerHTML = `
                    <h3><i class="fas fa-exclamation-triangle"></i> Erro ao Carregar Aplicações</h3>
                    <p><strong>Detalhes:</strong> ${error.message}</p>
                    <p><strong>API:</strong> ${API_BASE}/api/test-data/applications</p>
                    <button onclick="location.reload()" class="btn btn-view" style="margin-top: 10px;">
                        <i class="fas fa-sync"></i> Tentar Novamente
                    </button>
                `;
            }
        }
        
        // Auto-load on page ready
        document.addEventListener('DOMContentLoaded', loadApplications);
    </script>
</body>
</html>
