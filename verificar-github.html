<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Status GitHub - FLEXCREDI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .btn {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            font-weight: 600;
            margin: 10px 0;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }
        
        .result {
            background: #2c3e50;
            color: #2ecc71;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-top: 20px;
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .error { color: #e74c3c; }
        .success { color: #2ecc71; }
        .info { color: #3498db; }
        .warning { color: #f39c12; }
        
        .status-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        
        .status-box h3 {
            color: #856404;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Verificar Status do GitHub</h1>
        
        <div class="status-box">
            <h3>⚠️ O que vamos verificar:</h3>
            <p>1. Tamanho atual do index.html no GitHub</p>
            <p>2. Se o arquivo tem o carousel completo</p>
            <p>3. Quantos slides existem no código</p>
        </div>
        
        <button class="btn" onclick="checkGitHub()">
            1️⃣ VERIFICAR O QUE ESTÁ NO GITHUB
        </button>
        
        <button class="btn btn-success" onclick="forceUpload()" style="display: none;" id="forceUploadBtn">
            2️⃣ FORÇAR UPLOAD CORRETO
        </button>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        const TOKEN = "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";
        const USER = "chazmarques-blip";
        const REPO = "FLEXCREDI-COMPLETO";
        const headers = {
            "Authorization": `token ${TOKEN}`,
            "Accept": "application/vnd.github.v3+json"
        };

        function log(message, type = 'info') {
            const resultEl = document.getElementById('result');
            resultEl.style.display = 'block';
            const line = document.createElement('div');
            line.className = type;
            line.textContent = message;
            resultEl.appendChild(line);
        }

        async function checkGitHub() {
            const resultEl = document.getElementById('result');
            resultEl.innerHTML = '';
            resultEl.style.display = 'block';
            
            log('🔍 Verificando index.html no GitHub...', 'info');
            log('', 'info');
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${USER}/${REPO}/contents/index.html`,
                    { headers }
                );
                
                if (response.ok) {
                    const data = await response.json();
                    
                    log('✅ ARQUIVO ENCONTRADO NO GITHUB', 'success');
                    log(`📦 SHA: ${data.sha}`, 'info');
                    log(`📊 Tamanho: ${(data.size / 1024).toFixed(1)} KB`, 'info');
                    log('', 'info');
                    
                    // Decodifica o conteúdo
                    const content = atob(data.content);
                    
                    // Verifica slides
                    const slideCount = (content.match(/carousel-slide/g) || []).length;
                    const mosaicImages = (content.match(/mosaic-\w+\.jpg/g) || []);
                    
                    log('🎯 ANÁLISE DO CONTEÚDO:', 'warning');
                    log(`   Slides encontrados: ${slideCount}`, slideCount >= 6 ? 'success' : 'error');
                    log(`   Imagens mosaic: ${mosaicImages.length}`, mosaicImages.length >= 6 ? 'success' : 'error');
                    log('', 'info');
                    
                    if (mosaicImages.length > 0) {
                        log('📸 Imagens encontradas:', 'info');
                        const uniqueImages = [...new Set(mosaicImages)];
                        uniqueImages.forEach(img => log(`   • ${img}`, 'info'));
                        log('', 'info');
                    }
                    
                    // Verifica tamanho esperado
                    const expectedSize = 94; // KB
                    const actualSize = data.size / 1024;
                    
                    if (actualSize < expectedSize - 10) {
                        log('❌ PROBLEMA DETECTADO!', 'error');
                        log(`   Tamanho esperado: ~${expectedSize} KB`, 'error');
                        log(`   Tamanho atual: ${actualSize.toFixed(1)} KB`, 'error');
                        log(`   Diferença: ${(expectedSize - actualSize).toFixed(1)} KB faltando`, 'error');
                        log('', 'info');
                        log('💡 SOLUÇÃO: Clique no botão abaixo para fazer upload correto', 'warning');
                        
                        document.getElementById('forceUploadBtn').style.display = 'block';
                    } else if (slideCount < 6) {
                        log('❌ CAROUSEL INCOMPLETO!', 'error');
                        log(`   Slides esperados: 6`, 'error');
                        log(`   Slides encontrados: ${slideCount}`, 'error');
                        log('', 'info');
                        log('💡 SOLUÇÃO: Clique no botão abaixo para fazer upload correto', 'warning');
                        
                        document.getElementById('forceUploadBtn').style.display = 'block';
                    } else {
                        log('✅ ARQUIVO PARECE CORRETO!', 'success');
                        log('', 'info');
                        log('🤔 SE O SITE AINDA NÃO MUDOU:', 'warning');
                        log('   1. Aguarde mais 2-3 minutos para o build do Vercel', 'info');
                        log('   2. Limpe o cache do navegador (Ctrl+Shift+R)', 'info');
                        log('   3. Acesse: https://flexcredi.vercel.app', 'info');
                        log('', 'info');
                        log('📊 Links para verificar:', 'info');
                        log('   GitHub: https://github.com/chazmarques-blip/FLEXCREDI-COMPLETO', 'info');
                        log('   Vercel: https://vercel.com/charles-marques-projects/flexcredi', 'info');
                    }
                    
                } else {
                    log('❌ Erro ao buscar arquivo', 'error');
                    log(`Status: ${response.status}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Erro: ${error.message}`, 'error');
            }
        }

        async function forceUpload() {
            log('', 'info');
            log('⚠️ ATENÇÃO: Para fazer o upload correto:', 'warning');
            log('', 'info');
            log('1. Volte para o GenSpark', 'info');
            log('2. Baixe NOVAMENTE o arquivo "index-para-upload.html"', 'info');
            log('3. Abra o arquivo "deploy-completo.html"', 'info');
            log('4. Selecione o index-para-upload.html', 'info');
            log('5. Faça o upload', 'info');
            log('', 'info');
            log('💡 DICA: O upload deve demorar 10-20 segundos', 'warning');
            log('   Se for muito rápido (1-2 segundos), NÃO funcionou!', 'warning');
        }
    </script>
</body>
</html>
