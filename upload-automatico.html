<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXCREDI - Upload Automático para GitHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #2ecc71;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }
        
        .status-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .btn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
        }
        
        .btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        
        .progress {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71 0%, #27ae60 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        
        .log {
            background: #2c3e50;
            color: #2ecc71;
            padding: 20px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 20px;
        }
        
        .log-entry {
            margin-bottom: 8px;
        }
        
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
        .info { color: #3498db; }
        .warning { color: #f39c12; }
        
        .links {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        
        .links h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .links a {
            display: block;
            color: #3498db;
            text-decoration: none;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 FLEXCREDI - Deploy Automático</h1>
        
        <div class="status-box">
            <h3>Status do Upload</h3>
            <div class="progress">
                <div class="progress-bar" id="progress">0%</div>
            </div>
            <p id="status">Pronto para iniciar</p>
        </div>
        
        <button class="btn" id="uploadBtn" onclick="startUpload()">
            INICIAR UPLOAD PARA GITHUB
        </button>
        
        <div class="log" id="log"></div>
        
        <div class="links" id="links">
            <h3>🔗 Links Importantes</h3>
            <a href="https://github.com/chazmarques-blip/FLEXCREDI-COMPLETO" target="_blank">📦 Ver Repositório no GitHub</a>
            <a href="https://vercel.com/charles-marques-projects/flexcredi" target="_blank">🚀 Painel Vercel</a>
            <a href="https://flexcredi.vercel.app" target="_blank">🌐 Site em Produção</a>
        </div>
    </div>

    <script>
        const TOKEN = "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";
        const USER = "chazmarques-blip";
        const REPO = "FLEXCREDI-COMPLETO";
        const headers = {
            "Authorization": `token ${TOKEN}`,
            "Accept": "application/vnd.github.v3+json"
        };

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateProgress(percent, text) {
            const progressBar = document.getElementById('progress');
            progressBar.style.width = percent + '%';
            progressBar.textContent = percent + '%';
            document.getElementById('status').textContent = text;
        }

        async function getFileSha(path) {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${USER}/${REPO}/contents/${path}`,
                    { headers }
                );
                if (response.ok) {
                    const data = await response.json();
                    return data.sha;
                }
            } catch (e) {}
            return null;
        }

        async function uploadFile(path, content) {
            log(`📤 Enviando: ${path}`, 'info');
            
            const sha = await getFileSha(path);
            const contentB64 = btoa(unescape(encodeURIComponent(content)));
            
            const data = {
                message: `Deploy: Atualizar ${path}`,
                content: contentB64,
                branch: "main"
            };
            
            if (sha) {
                data.sha = sha;
            }
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${USER}/${REPO}/contents/${path}`,
                    {
                        method: 'PUT',
                        headers: {
                            ...headers,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    }
                );
                
                if (response.ok) {
                    const result = await response.json();
                    log(`✅ ${path} enviado com sucesso! (${result.commit.sha.substring(0, 7)})`, 'success');
                    return true;
                } else {
                    const error = await response.text();
                    log(`❌ Erro ao enviar ${path}: ${response.status}`, 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ Erro: ${error.message}`, 'error');
                return false;
            }
        }

        async function startUpload() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.textContent = 'UPLOAD EM PROGRESSO...';
            
            log('🚀 Iniciando upload para o GitHub...', 'info');
            updateProgress(0, 'Iniciando...');
            
            // Lista de arquivos para upload com seu conteúdo
            const files = [
                {
                    path: 'vercel.json',
                    content: `{
  "rewrites": [
    {
      "source": "/(.*)",
      "destination": "/admin-dashboard.html",
      "has": [
        {
          "type": "host",
          "value": "admin.flexcredi.com"
        }
      ]
    }
  ]
}`
                }
            ];
            
            let completed = 0;
            const total = files.length;
            
            for (const file of files) {
                await uploadFile(file.path, file.content);
                completed++;
                const percent = Math.round((completed / total) * 100);
                updateProgress(percent, `${completed}/${total} arquivos enviados`);
                
                // Pequena pausa entre uploads
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            log('🎉 UPLOAD CONCLUÍDO COM SUCESSO!', 'success');
            log('⏱️  O Vercel vai detectar as mudanças em ~30 segundos', 'info');
            log('🔨 Build no Vercel levará ~3-5 minutos', 'info');
            log('✅ Depois teste: https://flexcredi.vercel.app', 'success');
            
            updateProgress(100, 'Concluído!');
            btn.textContent = 'UPLOAD CONCLUÍDO ✓';
            btn.style.background = '#27ae60';
            
            document.getElementById('links').style.display = 'block';
        }
    </script>
</body>
</html>
